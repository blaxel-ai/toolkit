name: Test install.ps1

on:
  pull_request:
    branches:
      - main
    paths:
      - "install.ps1"
      - "cli/upgrade.go"
      - "test/install/test_setup_policy.ps1"
      - "test/install/test_release_lookup.ps1"
      - ".github/workflows/test-install-ps1.yaml"

jobs:
  test-install-ps1:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test setup policy
        shell: pwsh
        run: ./test/install/test_setup_policy.ps1

      - name: Test release lookup
        shell: pwsh
        run: ./test/install/test_release_lookup.ps1 -Live

      # Windows PowerShell 5.1 is what most people get from irm | iex.
      - name: Test release lookup in Windows PowerShell 5.1
        shell: powershell
        run: ./test/install/test_release_lookup.ps1 -Live

      - name: Run install.ps1 in Windows PowerShell 5.1, from a file and through irm | iex
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }
          $script = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/install.ps1"
          $output = powershell -NoProfile -Command "irm $script | iex; 'session still open'" 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'session still open') { throw "irm | iex closed the session" }
          & (Join-Path $env:LOCALAPPDATA "blaxel\bl.exe") version

      - name: Run install.ps1 with latest release
        shell: pwsh
        run: |
          .\install.ps1
          # Persist the install directory into GITHUB_PATH so subsequent steps can find bl/blaxel
          $installDir = Join-Path $env:LOCALAPPDATA "blaxel"
          echo $installDir >> $env:GITHUB_PATH

      - name: Verify blaxel.exe exists
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "blaxel"
          if (-not (Test-Path (Join-Path $installDir "blaxel.exe"))) {
            Write-Error "blaxel.exe not found in $installDir"
            exit 1
          }
          Write-Host "blaxel.exe found in $installDir"

      - name: Verify bl.exe alias exists
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "blaxel"
          if (-not (Test-Path (Join-Path $installDir "bl.exe"))) {
            Write-Error "bl.exe not found in $installDir"
            exit 1
          }
          Write-Host "bl.exe found in $installDir"

      - name: Verify PATH was updated and bl runs
        shell: pwsh
        run: |
          bl version

      - name: Verify Git-missing warning appears when git is absent
        shell: pwsh
        run: |
          # Reinstall in a child PowerShell with PATH stripped of any git location
          # to assert that the install script surfaces the "Git was not found" hint.
          $filteredPath = ($env:Path -split ';' | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ 'git.exe'))
          }) -join ';'
          $output = & pwsh -NoProfile -Command {
            param($p)
            $env:Path = $p
            & .\install.ps1 2>&1
          } -args $filteredPath
          $joined = ($output | Out-String)
          if ($joined -notmatch 'Git was not found') {
            Write-Error "Expected 'Git was not found' warning in output but got:`n$joined"
            exit 1
          }
          Write-Host "Git-missing warning is correctly surfaced."

      - name: Login with API key and verify workspace access
        shell: pwsh
        env:
          BL_API_KEY: ${{ secrets.BL_API_KEY }}
          BL_WORKSPACE: ${{ secrets.BL_WORKSPACE }}
        run: |
          if ([string]::IsNullOrEmpty($env:BL_API_KEY) -or [string]::IsNullOrEmpty($env:BL_WORKSPACE)) {
            Write-Host "BL_API_KEY or BL_WORKSPACE secret not set; skipping login smoke test."
            exit 0
          }
          bl login $env:BL_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            Write-Error "bl login failed with exit code $LASTEXITCODE"
            exit 1
          }
          bl workspaces
          if ($LASTEXITCODE -ne 0) {
            Write-Error "bl workspaces failed with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "Login + workspace listing succeeded."

      - name: Run install.ps1 with -SkipSetup
        shell: powershell
        run: |
          # The switch must reach the installer even when BL_INSTALL_SETUP=true.
          $env:BL_INSTALL_SETUP = "true"
          $output = powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -SkipSetup 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }
          if ($output -match "Blaxel setup") { throw "-SkipSetup was ignored: bl setup ran" }

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: true

      - name: bl upgrade replaces the running bl.exe
        shell: pwsh
        run: |
          # An old bl from this branch, upgraded with this branch's install.ps1.
          $bl = Join-Path $env:LOCALAPPDATA "blaxel\bl.exe"
          $script = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/install.ps1"
          go build -ldflags "-X main.version=0.0.1 -X github.com/blaxel-ai/toolkit/cli.installPS1URL=$script" -o $bl .
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          & $bl upgrade
          if ($LASTEXITCODE -ne 0) { throw "bl upgrade exited with $LASTEXITCODE" }
          $version = & $bl version | Out-String
          Write-Host $version
          if ($version -notmatch "Version:\s*\d" -or $version -match "0\.0\.1") { throw "bl upgrade did not replace bl.exe" }

      # Client Windows defaults to the Restricted execution policy, which irm | iex must not need.
      - name: Install through irm | iex under a Restricted execution policy
        shell: powershell
        run: |
          $script = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/install.ps1"
          try {
            foreach ($shell in "powershell", "pwsh") {
              & $shell -NoProfile -Command "Set-ExecutionPolicy -Scope CurrentUser Restricted -Force"
              $output = & $shell -NoProfile -Command "Get-ExecutionPolicy; irm $script | iex; 'session still open'" 2>&1 | Out-String
              Write-Host $output
              if ($output -notmatch "Restricted") { throw "$shell did not run under the Restricted policy" }
              if ($output -match "Blaxel install failed" -or $output -notmatch "session still open") { throw "install.ps1 failed in $shell under the Restricted policy" }
            }
          }
          finally {
            foreach ($shell in "powershell", "pwsh") { & $shell -NoProfile -Command "Set-ExecutionPolicy -Scope CurrentUser Undefined -Force" }
          }
