name: Test setup and installer

on:
  pull_request:
    branches:
      - main
    paths:
      - "cli/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "install.sh"
      - "install.ps1"
      - "test/install/**"
      - ".github/workflows/test-setup.yaml"

jobs:
  # install.sh against a local release: release lookup, checksums, PATH,
  # completions and the hand-off to bl setup, with no network for the CLI.
  installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          check-latest: true
          cache: true

      - name: Release lookup
        run: sh test/install/test_release_lookup.sh

      - name: Installer and skills, end to end
        run: |
          go build -o "$RUNNER_TEMP/blaxel" .
          python3 test/install/test_homebrew_skills.py "$RUNNER_TEMP/blaxel"
          python3 test/install/test_managed_skills.py "$RUNNER_TEMP/blaxel"

      - name: Installer under sudo, in a container
        run: sh test/install/test_sudo.sh "$RUNNER_TEMP/blaxel"

  # The built bl setup, with its defaults, in a home with three coding agents.
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          check-latest: true
          cache: true

      - name: bl setup (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/bl" .
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/.claude" "$home/.cursor" "$home/.codex"
          HOME="$home" XDG_CONFIG_HOME="$home/.config" "$RUNNER_TEMP/bl" setup --yes
          test -f "$home/.agents/skills/blaxel-cli/SKILL.md"
          test -e "$home/.claude/skills/blaxel-cli"
          grep -q '"blaxel"' "$home/.cursor/mcp.json"
          grep -q 'mcp_servers.blaxel' "$home/.codex/config.toml"
          grep -q '"blaxel"' "$home/.claude.json"
          # CI never turns error reports on.
          ! grep -qs '^tracking: true' "$home/.blaxel/config.yaml"
          # The agents start bl mcp from their configuration.
          python3 test/install/test_bl_mcp.py "$home"

          # bl uninstall undoes it. --dry-run, and a run with no terminal and
          # no --yes, change nothing; --yes removes what setup wrote.
          bl() { HOME="$home" XDG_CONFIG_HOME="$home/.config" "$RUNNER_TEMP/bl" "$@"; }
          snapshot() { (cd "$home" && { find . -type f -exec cksum {} +; find . -type l; } | sort); }
          before="$(snapshot)"
          bl uninstall --dry-run
          if bl uninstall < /dev/null; then echo "uninstall ran without --yes"; exit 1; fi
          if [ "$before" != "$(snapshot)" ]; then echo "uninstall changed files without --yes"; exit 1; fi
          bl uninstall --yes
          for path in .agents/skills/blaxel-cli .claude/skills/blaxel-cli .agents/.skill-lock.json; do
            if [ -e "$home/$path" ] || [ -L "$home/$path" ]; then echo "uninstall left $path"; exit 1; fi
          done
          if grep -qs '"blaxel' "$home/.cursor/mcp.json" "$home/.claude.json"; then echo "uninstall left a Blaxel MCP server"; exit 1; fi
          if grep -qs 'mcp_servers.blaxel' "$home/.codex/config.toml"; then echo "uninstall left the Codex MCP server"; exit 1; fi
          grep -q '"uninstalled": true' "$home/.blaxel/skills/state.json"
          grep -q '"autoupdate": false' "$home/.blaxel/mcp/state.json"
          grep -q 'Nothing to remove' <<<"$(bl uninstall --yes)"
          # The refresh bl upgrade and the installers run leaves the skills
          # and MCP servers out after uninstall, even when forced on.
          BL_INSTALL_REFRESH=true BL_INSTALL_SKILLS=true BL_INSTALL_MCP=true bl setup --yes --skip-login
          if grep -qs '"blaxel' "$home/.cursor/mcp.json" "$home/.claude.json"; then echo "the refresh added the MCP servers back"; exit 1; fi
          if [ -e "$home/.agents/skills/blaxel-cli" ]; then echo "the refresh added the skills back"; exit 1; fi
          # bl setup adds them back and turns their automatic updates on.
          bl setup --yes --skip-login
          grep -q '"blaxel"' "$home/.cursor/mcp.json"
          test -f "$home/.agents/skills/blaxel-cli/SKILL.md"
          if [ -e "$home/.blaxel/mcp/state.json" ]; then echo "bl setup left MCP updates off"; exit 1; fi
          if grep -q '"uninstalled": true' "$home/.blaxel/skills/state.json"; then echo "bl setup left the skills marked uninstalled"; exit 1; fi

      - name: Agent installer hand-off (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh test/install/test_agent_setup.sh

      - name: Agent installer hand-off (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File test/install/test_agent_setup.ps1
          powershell -NoProfile -File test/install/test_agent_setup.ps1

      - name: bl setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\bl.exe" .
          $root = Join-Path $env:RUNNER_TEMP "home"
          foreach ($dir in ".claude", ".cursor", ".codex") { New-Item -ItemType Directory -Force (Join-Path $root $dir) | Out-Null }
          $env:USERPROFILE = $root
          $env:HOME = $root
          & "$env:RUNNER_TEMP\bl.exe" setup --yes
          if ($LASTEXITCODE -ne 0) { throw "bl setup exited with $LASTEXITCODE" }
          foreach ($path in ".agents\skills\blaxel-cli\SKILL.md", ".claude\skills\blaxel-cli", ".cursor\mcp.json", ".codex\config.toml", ".claude.json") {
            if (-not (Test-Path (Join-Path $root $path))) { throw "missing $path" }
          }
          if (-not (Select-String -Quiet -Path (Join-Path $root ".codex\config.toml") -Pattern 'mcp_servers.blaxel')) { throw "Codex has no blaxel MCP server" }
          # CI never turns error reports on.
          $config = Join-Path $root ".blaxel\config.yaml"
          if ((Test-Path $config) -and (Select-String -Quiet -Path $config -Pattern '^tracking: true')) { throw "error reports were turned on in CI" }
          # The agents start bl mcp from their configuration (here a Windows path in JSON).
          python test/install/test_bl_mcp.py $root
          if ($LASTEXITCODE -ne 0) { throw "bl mcp did not answer" }

          # bl uninstall undoes it. --dry-run, and a run with no terminal and
          # no --yes, change nothing; --yes removes what setup wrote.
          $snapshot = { Get-ChildItem -Recurse -Force $root | ForEach-Object { if ($_.PSIsContainer) { $_.FullName } else { "$($_.FullName) $((Get-FileHash -LiteralPath $_.FullName).Hash)" } } | Sort-Object }
          $before = & $snapshot
          & "$env:RUNNER_TEMP\bl.exe" uninstall --dry-run
          if ($LASTEXITCODE -ne 0) { throw "bl uninstall --dry-run exited with $LASTEXITCODE" }
          $out = & "$env:RUNNER_TEMP\bl.exe" uninstall
          if ($LASTEXITCODE -ne 1) { throw "bl uninstall without a terminal or --yes exited with $LASTEXITCODE" }
          if (Compare-Object $before (& $snapshot)) { throw "bl uninstall changed files without --yes" }
          & "$env:RUNNER_TEMP\bl.exe" uninstall --yes
          if ($LASTEXITCODE -ne 0) { throw "bl uninstall --yes exited with $LASTEXITCODE" }
          foreach ($path in ".agents\skills\blaxel-cli", ".claude\skills\blaxel-cli", ".agents\.skill-lock.json") {
            if (Test-Path (Join-Path $root $path)) { throw "bl uninstall left $path" }
          }
          foreach ($check in @(@(".cursor\mcp.json", '"blaxel'), @(".claude.json", '"blaxel'), @(".codex\config.toml", 'mcp_servers\.blaxel'))) {
            $path = Join-Path $root $check[0]
            if ((Test-Path $path) -and (Select-String -Quiet -Path $path -Pattern $check[1])) { throw "bl uninstall left a Blaxel MCP server in $($check[0])" }
          }
          if (-not (Select-String -Quiet -Path (Join-Path $root ".blaxel\skills\state.json") -Pattern '"uninstalled": true')) { throw "bl uninstall did not mark the skills uninstalled" }
          if (-not (Select-String -Quiet -Path (Join-Path $root ".blaxel\mcp\state.json") -Pattern '"autoupdate": false')) { throw "automatic MCP updates are still on" }
          $out = & "$env:RUNNER_TEMP\bl.exe" uninstall --yes
          if (-not ($out -match 'Nothing to remove')) { throw "a second bl uninstall found something to remove" }
          # The refresh bl upgrade and the installers run leaves the skills
          # and MCP servers out after uninstall, even when forced on.
          $env:BL_INSTALL_REFRESH = "true"
          $env:BL_INSTALL_SKILLS = "true"
          $env:BL_INSTALL_MCP = "true"
          & "$env:RUNNER_TEMP\bl.exe" setup --yes --skip-login
          if ($LASTEXITCODE -ne 0) { throw "the setup refresh exited with $LASTEXITCODE" }
          Remove-Item Env:BL_INSTALL_REFRESH, Env:BL_INSTALL_SKILLS, Env:BL_INSTALL_MCP
          $cursor = Join-Path $root ".cursor\mcp.json"
          if ((Test-Path $cursor) -and (Select-String -Quiet -Path $cursor -Pattern '"blaxel')) { throw "the refresh added the MCP servers back" }
          if (Test-Path (Join-Path $root ".agents\skills\blaxel-cli")) { throw "the refresh added the skills back" }
          # bl setup adds them back and turns their automatic updates on.
          & "$env:RUNNER_TEMP\bl.exe" setup --yes --skip-login
          if ($LASTEXITCODE -ne 0) { throw "bl setup exited with $LASTEXITCODE" }
          if (-not (Select-String -Quiet -Path $cursor -Pattern '"blaxel"')) { throw "bl setup did not add the MCP servers back" }
          if (-not (Test-Path (Join-Path $root ".agents\skills\blaxel-cli\SKILL.md"))) { throw "bl setup did not add the skills back" }
          if (Test-Path (Join-Path $root ".blaxel\mcp\state.json")) { throw "bl setup left MCP updates off" }
          if (Select-String -Quiet -Path (Join-Path $root ".blaxel\skills\state.json") -Pattern '"uninstalled": true') { throw "bl setup left the skills marked uninstalled" }

          # Regression: a later namespaced SDK skill plus a flat duplicate
          # must be repaired without Developer Mode or symlink privileges.
          $nestedRoot = Join-Path $env:RUNNER_TEMP "nested-home"
          $env:USERPROFILE = $nestedRoot
          $env:HOME = $nestedRoot
          $nested = Join-Path $nestedRoot ".agents\skills\blaxel\blaxel-sdk"
          $flat = Join-Path $nestedRoot ".agents\skills\blaxel-sdk"
          New-Item -ItemType Directory -Force $nested, $flat | Out-Null
          $manifest = "---`nname: blaxel-sdk`ndescription: Retain local Windows skill.`n---`nLocal fork.`n"
          Set-Content -Path (Join-Path $nested "SKILL.md") -Value $manifest -NoNewline
          Set-Content -Path (Join-Path $flat "custom.txt") -Value "keep displaced copy" -NoNewline
          foreach ($attempt in 1..2) {
            & "$env:RUNNER_TEMP\bl.exe" setup --yes --skip-mcp --skip-login
            if ($LASTEXITCODE -ne 0) { throw "nested bl setup exited with $LASTEXITCODE" }
            if ((Get-Content -Raw (Join-Path $flat "SKILL.md")) -ne $manifest) { throw "local skill contents changed" }
            $item = Get-Item -Force $flat
            if ($item.LinkType -ne "Junction") { throw "flat skill is not a junction" }
          }
          $backups = @(Get-ChildItem -Directory (Join-Path $nestedRoot ".agents") -Filter ".blaxel-skills-backup-*")
          if ($backups.Count -ne 1) { throw "expected exactly one retained backup" }
          $saved = Join-Path $backups[0].FullName "blaxel-sdk\custom.txt"
          if ((Get-Content -Raw $saved) -ne "keep displaced copy") { throw "duplicate customization was not preserved" }

      - name: Additional coding agent MCP targets (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 test/install/test_setup_mcp_agents.py "$RUNNER_TEMP/bl"

      - name: Additional coding agent MCP targets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python test/install/test_setup_mcp_agents.py "$env:RUNNER_TEMP\bl.exe"
          if ($LASTEXITCODE -ne 0) { throw "coding agent MCP setup tests failed" }
