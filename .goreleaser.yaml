# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: blaxel

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  - main: ./main.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.sentryDSN={{ .Env.SENTRY_DSN }}
    goos:
      - linux
      - windows
      - darwin

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  header: |
    ## Blaxel CLI: {{ .Tag }} ({{ .Date }})

    See our amazing latest updates below.
  footer: |
    Have a good one.

brews:
  - name: blaxel
    caveats: |
      Blaxel is a tool to ship AI agents that never slack.

      Blaxel skills are installed automatically the first time you run any bl command
      after installation or upgrade, including bl --help and bl --version.
      Requires Node.js (npx). Set BL_INSTALL_SKILLS=false to skip.
      To install or retry manually:
        npx -y skills add blaxel-ai/agent-skills -g --all
      bl upgrade also refreshes the skills. Installation failures never block the CLI.
    homepage: "https://www.blaxel.ai"
    skip_upload: auto
    install: |
      bin.install "blaxel"
      bin.install_symlink "blaxel" => "bl"
    repository:
      owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
      name: homebrew-blaxel
      pull_request:
        enabled: false
